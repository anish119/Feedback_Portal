# ── Server ─────────────────────────────────────────────────
server.port=8080

# ── Load .env file as a property source ────────────────────
spring.config.import=optional:file:.env[.properties]

# ── DataSource ─────────────────────────────────────────────
spring.datasource.url=${FEEDBACK_DB_URL}
spring.datasource.username=${FEEDBACK_DB_USERNAME}
spring.datasource.password=${FEEDBACK_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Admin seed (reads from .env) ───────────────────────────
app.admin.user-id=${ADMIN_USER_ID}
app.admin.password=${ADMIN_PASSWORD}

# ── Thymeleaf ──────────────────────────────────────────────
spring.thymeleaf.cache=false
